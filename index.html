<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brasileirão Action Zones</title>
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>
    <header id="main-header">
        <!-- Image with alt text -->
        <img src="https://upload.wikimedia.org/wikipedia/commons/2/2b/Campeonato_Brasileiro_S%C3%A9rie_A_logo_%282024%29.svg?utm_source=pt.wikipedia.org&utm_campaign=imageinfo&utm_content=original" alt="Brasileirao League Logo" id="league-logo">
        <h1>Brasileirão Area Dominance</h1>
    </header>

    <nav>
        <ul>
            <li><a href="#controls">Stat Selector</a></li>
            <li><a href="#pitch-view">Tactical Pitch</a></li>
            <li><a href="#spotlight-section">Player Spotlight</a></li>
        </ul>
    </nav>

    <main>
        <!-- Section 1: Form & Controls -->
        <section id="controls">
            <h2>Configure View</h2>
            <form id="stat-form" onsubmit="return false;">
                <label for="stat-selector">Select Action Metric: </label>
                <select id="stat-selector">
                    <option value="passes">Most Passes</option>
                    <option value="tackles">Most Tackles</option>
                </select>
                <button type="button" id="clear-btn">Clear Field</button>
            </form>
        </section>

        <!-- Section 2: The Pitch Grid -->
        <section id="pitch-view">
            <div class="pitch-wrapper">
                <!-- CSS Field Markings -->
                <div class="pitch-markings center-line"></div>
                <div class="pitch-markings center-circle"></div>
                <div class="pitch-markings center-spot"></div>
                <div class="pitch-markings penalty-box left"></div>
                <div class="pitch-markings penalty-box right"></div>
                <div class="pitch-markings goal-area left"></div>
                <div class="pitch-markings goal-area right"></div>
                
                <!-- The Interactive Grid -->
                <div id="pitch" class="pitch-grid">
                    <!-- JavaScript will populate the 24 zones here -->
                </div>
            </div>
        </section>

        <!-- Section 3: Spotlight Information -->
        <section id="spotlight-section">
            <article id="player-spotlight">
                <h2>Zone Spotlight</h2>
                <p id="spotlight-text">Click on any active zone on the pitch to see detailed player information.</p>
            </article>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Brasileirão Statistics Prototype</p>
    </footer>

    <script src="scripts/script.js"></script>
</body>
</html>
